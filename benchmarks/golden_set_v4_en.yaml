version: 2026-07-29-en-v4-candidate
language: en
status: candidate
review_status: automated-source-validation-pending-human-review
purpose: >-
  Evaluate English retrieval against the live federated corpus. This set is
  deliberately independent of the Italian candidate set and separates
  positive retrieval, near-domain rejection, and out-of-domain rejection.
snapshot:
  live_endpoint: https://mac-mini-01.taild7292a.ts.net:8443
  graph_node_count: 503
  harness_commit: e890c64
  source_scope: external English Markdown notes only
  source_projects:
    - privacy-guard
    - tinka
    - bdh-graph-harness
    - bdh-hermes-bridge
    - mlx-lm-glm52
    - hermes-avatar-widget
    - assess-chat
splits:
  development: 22
  holdout: 18
quality_rules:
  - Every positive qrel names a live graph node ID and graded relevance.
  - No source document is primary for more than two positive queries.
  - Negative queries must have an empty qrel and must remain answerable only by rejecting retrieval.
  - A human reviewer must verify every source claim before promotion from candidate to golden.
